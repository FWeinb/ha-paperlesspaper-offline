name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Set manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          manifest=custom_components/paperlessoffline/manifest.json
          jq --arg v "${TAG#v}" '.version = $v' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
      - name: Zip integration
        working-directory: custom_components/paperlessoffline
        run: zip -r "$GITHUB_WORKSPACE/paperlessoffline.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" paperlessoffline.zip --clobber
